<!-- Fonte dos ícones de tela inicial (apple-touch-icon, icone-192, icone-512).

     POR QUE ESTE TEM FUNDO E O DA GUIA NÃO. Ícone de lançador cai sobre um
     fundo que ninguém controla: papel de parede qualquer, e o iOS ainda
     preenche de PRETO o que for vazado em apple-touch-icon. Sem fundo
     próprio, o traço fino desaparece metade das vezes.

     O que mudou: o fundo deixou de ser a placa azul de destaque e passou a
     ser o PAPEL ESCURO do site (o mesmo do tema escuro, token paper), com o nabla
     no tom claro de destaque. Assim o ícone da tela inicial é o site, e não
     uma etiqueta azul que não aparece em lugar nenhum.

     Sem canto arredondado: iOS e Android aplicam a máscara deles. Desenhar a
     minha por baixo só produzia canto duplo. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Nabla">
  <title>Nabla</title>
  <rect width="32" height="32" fill="#10212c" />
  <path
    d="M4 7.4h24L16 25.6z"
    fill="none"
    stroke="#5cbdda"
    stroke-width="2.6"
    stroke-linejoin="round"
  />
</svg>
