<!-- Fonte dos ícones de tela inicial, e o único lugar onde a placa colorida
     sobreviveu. Motivo: o iOS não respeita transparência em apple-touch-icon
     — o que for vazado ele preenche de preto. Aqui o fundo é parte do ícone,
     não recurso de contraste, e o ∇ tem a mesma espessura fina do favicon,
     só recuado para não encostar no canto arredondado. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Nabla">
  <title>Nabla</title>
  <rect width="32" height="32" rx="7" fill="#0f6c86" />
  <path
    d="M4.5 6.8h23L16 24.4z"
    fill="none"
    stroke="#eef1f1"
    stroke-width="2.6"
    stroke-linejoin="round"
  />
</svg>
