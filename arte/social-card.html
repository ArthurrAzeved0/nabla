      /* Tokens do tema escuro do site, copiados de src/styles/tokens.css. */
      :root {
        --paper: #10212c;
        --surface: #172934;
        --ink: #e7eff4;
        --ink-2: #b6c7d3;
        --ink-3: #8a9eac;
        --accent: #5cbdda;
        --line: #24404f;
        --grid-1: rgba(150, 215, 235, 0.035);
        --grid-2: rgba(150, 215, 235, 0.11);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 640px; overflow: hidden; }

      /* A mesma grade de prancha técnica do fundo do site: fina de 8px,
         forte de 48px. É o que faz o cartão ser reconhecível como o site. */
      body {
        background:
          linear-gradient(var(--grid-2) 1px, transparent 1px) 0 0 / 100% 48px,
          linear-gradient(90deg, var(--grid-2) 1px, transparent 1px) 0 0 / 48px 100%,
          linear-gradient(var(--grid-1) 1px, transparent 1px) 0 0 / 100% 8px,
          linear-gradient(90deg, var(--grid-1) 1px, transparent 1px) 0 0 / 8px 100%,
          var(--paper);
        color: var(--ink);
        font-family: "Archivo", system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        /* margem de segurança de 40px, mais um respiro */
        padding: 64px 72px;
      }

      .marca { display: flex; align-items: center; gap: 18px; }
      .marca svg { flex: none; }
      .marca b {
        font-family: "ANarrow", "Archivo", sans-serif;
        font-weight: 700;
        font-size: 52px;
        letter-spacing: 0.01em;
      }
      .marca span {
        font-family: "JBMono", monospace;
        font-size: 15px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--accent);
        margin-left: 6px;
        padding-left: 20px;
        border-left: 1px solid var(--line);
      }

      h1 {
        font-family: "ANarrow", "Archivo", sans-serif;
        font-weight: 700;
        font-size: 88px;
        line-height: 1.02;
        letter-spacing: -0.01em;
        max-width: 20ch;
      }
      h1 em { font-style: normal; color: var(--accent); }
      .sub {
        font-size: 25px;
        line-height: 1.45;
        color: var(--ink-2);
        max-width: 44ch;
        margin-top: 22px;
      }

      .numeros { display: flex; gap: 56px; align-items: flex-end; }
      .n b {
        display: block;
        font-family: "ANarrow", "Archivo", sans-serif;
        font-weight: 700;
        font-size: 46px;
        line-height: 1;
        color: var(--accent);
      }
      .n span {
        font-family: "JBMono", monospace;
        font-size: 13px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ink-3);
      }
      .url {
        margin-left: auto;
        font-family: "JBMono", monospace;
        font-size: 17px;
        color: var(--ink-2);
        padding-bottom: 4px;
      }
    </style>
  </head>
