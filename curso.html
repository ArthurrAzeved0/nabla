<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadeira — Responde Aí · Poli UPE</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/theme.js"></script>

<!-- MathJax: renderização das fórmulas (LaTeX) do conteúdo e das questões -->
<script>
  window.MathJax = {
    tex: {
      inlineMath: [["\\(", "\\)"]],
      displayMath: [["$$", "$$"]]
    },
    svg: { fontCache: "global" }
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" id="MathJax-script" async></script>
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html">
    <svg class="logo" viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
      <rect x="3" y="5" width="26" height="22" rx="4" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M9 12h14M9 17h14M9 22h8" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
    </svg>
    <span>Responde Aí <em>· Poli UPE</em></span>
  </a>
  <nav class="topnav">
    <a href="index.html">Início</a>
  </nav>
  <button id="theme-toggle" class="theme-btn" type="button" aria-label="Alternar tema claro/escuro" title="Alternar tema">
    <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M18.8 5.2l-2.1 2.1M7.3 16.7l-2.1 2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    </svg>
  </button>
</header>

<main class="wrap">
  <section class="curso-cabecalho">
    <span class="codigo" id="curso-codigo"></span>
    <h1 id="curso-nome">Carregando…</h1>
    <p class="descricao" id="curso-descricao"></p>
  </section>

  <div class="abas" role="tablist">
    <button class="aba ativa" data-painel="painel-conteudo" role="tab">Conteúdo</button>
    <button class="aba" data-painel="painel-questoes" role="tab">Questões</button>
  </div>

  <!-- Teoria: fragmento conteudo/<id>.html injetado aqui -->
  <section id="painel-conteudo" class="painel ativo" role="tabpanel">
    <p class="aviso-carregando">Carregando conteúdo…</p>
  </section>

  <!-- Questões: blocos questoes/<id>/<prova>/*.html injetados aqui -->
  <section id="painel-questoes" class="painel" role="tabpanel">
    <div class="filtro-provas" role="tablist">
      <button class="chip ativo" data-prova="1ee">1º EE</button>
      <button class="chip" data-prova="2ee">2º EE</button>
      <button class="chip" data-prova="final">Prova Final</button>
    </div>
    <div id="lista-questoes">
      <p class="aviso-carregando">Carregando questões…</p>
    </div>
  </section>
</main>

<footer class="rodape">
  <p>© <span id="ano"></span> Feito por <strong>Arthur Azevedo</strong> — aluno de Eng. de Controle e Automação (POLI/UPE).</p>
</footer>

<script src="js/cursos.js"></script>
<script src="questoes/manifest.js"></script>
<script src="js/curso.js"></script>
</body>
</html>
