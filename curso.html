<!--
  ENDEREÇO ANTIGO — só troca de host, PRESERVANDO query e âncora.

  Os links de questão e de teoria do site 1.x tinham esta forma:

      curso.html?curso=calculo3#calculo3-1ee-01
      curso.html?curso=calculo3#c3-multiplas

  Aqui não se traduz nada: manda para o MESMO caminho no endereço novo, onde
  public/curso.html faz a tradução para a rota atual. Assim a lógica de
  tradução vive num lugar só, e não em dois que podem divergir.
-->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>O Nabla mudou de endereço</title>
    <meta name="robots" content="noindex, follow" />
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font: 15px/1.6 system-ui, sans-serif; text-align: center; padding: 24px;
        background: #eef1f1; color: #16212a;
      }
      a { color: #0f6c86; }
      @media (prefers-color-scheme: dark) {
        body { background: #10212c; color: #e7eff4; }
        a { color: #5cbdda; }
      }
    </style>
  </head>
  <body>
    <div>
      <p>O site mudou de endereço. Levando você para a página certa…</p>
      <p><a id="destino" href="https://nabla-poli.pages.dev/">Se nada acontecer, clique aqui.</a></p>
    </div>
    <script>
      (function () {
        var destino = "https://nabla-poli.pages.dev/curso.html" + location.search + location.hash;
        var link = document.getElementById("destino");
        if (link) link.setAttribute("href", destino);
        location.replace(destino);
      })();
    </script>
  </body>
</html>
